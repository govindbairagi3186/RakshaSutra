<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#07111f"
  />

  <title>RakshaSutra | Login</title>

  <link
    rel="icon"
    href="favicon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="styles.css"
  />

  <link
    rel="stylesheet"
    href="pwa.css"
  />

  <style>

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo img {
      width: min(280px, 75%);
      max-height: 90px;
      object-fit: contain;
    }

    .auth-card {
      padding: 30px;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .auth-subtitle {
      text-align: center;
      opacity: 0.75;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .auth-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-weight: 600;
    }

    .auth-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: inherit;
      outline: none;
      font-size: 15px;
    }

    .auth-form input:focus {
      border-color: rgba(255,255,255,0.45);
    }

    .auth-button {
      width: 100%;
      margin-top: 4px;
    }

    .auth-message {
      min-height: 22px;
      text-align: center;
      margin: 0;
      font-size: 14px;
    }

    .auth-register {
      text-align: center;
      margin-top: 22px;
      opacity: 0.85;
    }

    .auth-register a {
      font-weight: 700;
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      font-size: 14px;
    }

    .auth-links a {
      font-weight: 700;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      opacity: 0.8;
    }

    .security-note {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.8;
    }

  </style>

</head>


<body>

  <div class="auth-page">

    <div class="auth-container">

      <div class="auth-logo">

        <img
          src="rakshasutra-logo.png"
          alt="RakshaSutra"
        />

      </div>


      <div class="card auth-card">

        <h1 class="auth-title">
          Welcome Back
        </h1>

        <p class="auth-subtitle">
          Log in to access your RakshaSutra safety dashboard.
        </p>


        <form
          class="auth-form"
          id="loginForm"
        >

          <label for="email">

            Email Address

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />

          </label>


          <label for="password">

            Password

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

          </label>


          <button
            class="primary-btn auth-button"
            type="submit"
          >
            🔐 Log In
          </button>


          <p
            class="auth-message"
            id="loginMessage"
            aria-live="polite"
          ></p>

        </form>


        <div class="auth-links">

          <a href="password.html">
            Forgot password?
          </a>

          <a href="password.html#change">
            Change password
          </a>

        </div>


        <div class="auth-register">

          Don't have an account?

          <a href="register.html">
            Create an account
          </a>

        </div>


        <div class="security-note">

          🔒 Your emergency profile details are stored
          with your account and are not requested again
          during normal login.

        </div>

      </div>


      <a
        class="back-home"
        href="index.html"
      >
        ← Back to RakshaSutra
      </a>

    </div>

  </div>


  <script
    type="module"
    src="login.js"
  ></script>

</body>

</html>
